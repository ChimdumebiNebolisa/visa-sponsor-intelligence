name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting and lint
        run: make lint

      - name: Type-check
        run: make typecheck

      - name: Test
        run: make test

      - name: Smoke-test Streamlit startup
        run: make smoke
