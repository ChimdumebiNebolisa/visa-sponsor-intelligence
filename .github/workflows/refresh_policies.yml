name: Manual supplemental policy refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institution-policy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Restore latest quality-approved build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/sponsor-intel-release
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "processed-parquet.zip" \
            --pattern "build-state.zip" \
            --pattern "source-manifests.zip" \
            --dir /tmp/sponsor-intel-release
          unzip -o /tmp/sponsor-intel-release/processed-parquet.zip -d .
          unzip -o /tmp/sponsor-intel-release/build-state.zip -d .
          unzip -o /tmp/sponsor-intel-release/source-manifests.zip -d .

      - name: Refresh supplemental policies and review outputs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_POLICY_MODEL: gpt-5.6-luna
          SPONSOR_INTEL_LOG_LEVEL: INFO
        run: uv run sponsor-intel refresh policies

      - name: Upload supplemental manual policy review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supplemental-manual-policy-review
          path: |
            data/processed/policy_documents.parquet
            data/processed/policy_facts.parquet
            data/processed/policy_review_queue.parquet
            data/review/policy_review_decisions.parquet
            outputs/reports/policy/summary.json
            outputs/reports/policy/errors.json
            outputs/reports/policy/evaluation.json
          if-no-files-found: warn
          retention-days: 7
