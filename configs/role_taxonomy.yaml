classification_version: role_taxonomy_v3
review_confidence_threshold: 0.90
role_families:
  - software_engineering
  - research_software
  - research_engineering
  - machine_learning_ai
  - data_engineering
  - data_science
  - systems_infrastructure
  - hpc
  - cloud
  - devops_sre
  - computer_science_research
  - technical_management_related
  - other_computing
  - not_relevant
  - ambiguous

exact_title_overrides:
  - title: Manager JC50 - Computer Systems Engineers/Architects
    technical_role: true
    role_family: technical_management_related
    confidence: 1.0
    reviewed_by: codex_role_audit
    reviewed_at: "2026-08-14"
  - title: Senior Associate JC60 -Computer Systems Engineers/Architects
    technical_role: true
    role_family: systems_infrastructure
    confidence: 1.0
    reviewed_by: codex_role_audit
    reviewed_at: "2026-08-14"
  - title: Manager JC50
    technical_role: null
    role_family: ambiguous
    confidence: 0.40
    reviewed_by: codex_role_audit
    reviewed_at: "2026-08-14"
soc_mappings:
  - prefixes: ["15-1131", "15-1132", "15-1133", "15-1134", "15-1251", "15-1252", "15-1253", "15-1254"]
    role_family: software_engineering
    confidence: 0.96
  - prefixes: ["15-1241", "15-1243"]
    role_family: data_engineering
    confidence: 0.95
  - prefixes: ["15-1121", "15-1141", "15-1142", "15-1211", "15-1212", "15-1242", "15-1244"]
    role_family: systems_infrastructure
    confidence: 0.95
  - prefixes: ["15-1111", "15-1221", "25-1021"]
    role_family: computer_science_research
    confidence: 0.95
  - prefixes: ["15-2051"]
    role_family: data_science
    confidence: 0.96
  - prefixes: ["11-3021"]
    role_family: technical_management_related
    confidence: 0.94
  - prefixes: ["15-1199", "15-1299"]
    role_family: other_computing
    confidence: 0.92

positive_title_rules:
  - rule_id: machine_learning_ai
    role_family: machine_learning_ai
    confidence: 0.96
    patterns: ["\\bMACHINE LEARNING\\b", "\\bARTIFICIAL INTELLIGENCE\\b", "\\bDEEP LEARNING\\b", "\\bCOMPUTER VISION\\b", "\\bNATURAL LANGUAGE PROCESSING\\b", "\\bNLP (ENGINEER|SCIENTIST)\\b", "\\bAI (ENGINEER|SCIENTIST|RESEARCHER)\\b"]
  - rule_id: hpc
    role_family: hpc
    confidence: 0.96
    patterns: ["\\bHIGH PERFORMANCE COMPUT", "\\bHPC (ENGINEER|DEVELOPER|SPECIALIST|ADMINISTRATOR)\\b", "\\bSUPERCOMPUT"]
  - rule_id: devops_sre
    role_family: devops_sre
    confidence: 0.96
    patterns: ["\\bDEVOPS\\b", "\\bSITE RELIABILITY\\b", "\\bSRE (ENGINEER|DEVELOPER)\\b", "\\bPLATFORM ENGINEER\\b", "\\bRELEASE ENGINEER\\b"]
  - rule_id: cloud
    role_family: cloud
    confidence: 0.95
    patterns: ["\\bCLOUD (ENGINEER|ARCHITECT|DEVELOPER|SPECIALIST|CONSULTANT)\\b", "\\bCLOUD INFRASTRUCTURE (ENGINEER|ARCHITECT|DEVELOPER|SPECIALIST)\\b", "\\bAWS (ENGINEER|ARCHITECT|DEVELOPER)\\b", "\\bAZURE (ENGINEER|ARCHITECT|DEVELOPER)\\b"]
  - rule_id: data_engineering
    role_family: data_engineering
    confidence: 0.96
    patterns: ["\\bDATA ENGINEER", "\\bANALYTICS ENGINEER", "\\bETL (ENGINEER|DEVELOPER|ARCHITECT)\\b", "\\bDATABASE (ENGINEER|ARCHITECT|DEVELOPER)\\b", "\\bBIG DATA (ENGINEER|DEVELOPER|ARCHITECT)\\b"]
  - rule_id: data_science
    role_family: data_science
    confidence: 0.96
    patterns: ["\\bDATA SCIENTIST", "\\bQUANTITATIVE (SCIENTIST|RESEARCHER)\\b", "\\bSTATISTICAL PROGRAMMER\\b"]
  - rule_id: research_software
    role_family: research_software
    confidence: 0.95
    patterns: ["\\bRESEARCH SOFTWARE (ENGINEER|DEVELOPER)\\b", "\\bSCIENTIFIC SOFTWARE (ENGINEER|DEVELOPER)\\b", "\\bSOFTWARE RESEARCH (ENGINEER|SCIENTIST)\\b"]
  - rule_id: research_engineering
    role_family: research_engineering
    confidence: 0.93
    patterns: ["\\bRESEARCH (COMPUTING|SYSTEMS|COMPUTER|ELECTRICAL) ENGINEER", "\\bCOMPUTATIONAL RESEARCH ENGINEER", "\\bR AND D SOFTWARE ENGINEER"]
  - rule_id: computer_science_research
    role_family: computer_science_research
    confidence: 0.94
    patterns: ["\\bCOMPUTER SCIENCE (RESEARCHER|SCIENTIST)\\b", "\\bCOMPUTING RESEARCH (SCIENTIST|FELLOW|ASSOCIATE)\\b", "\\bCOMPUTER AND INFORMATION RESEARCH SCIENTIST\\b"]
  - rule_id: systems_infrastructure
    role_family: systems_infrastructure
    confidence: 0.94
    patterns: ["\\bSYSTEMS ADMINISTRATOR", "\\bNETWORK (ENGINEER|ARCHITECT|ADMINISTRATOR)\\b", "\\bCYBERSECURITY (ENGINEER|ANALYST|ARCHITECT)\\b", "\\bSECURITY (ENGINEER|ARCHITECT)\\b", "\\bCOMPUTER SYSTEMS (ENGINEER|ARCHITECT|ANALYST)\\b", "\\bINFRASTRUCTURE ENGINEER"]
  - rule_id: technical_management
    role_family: technical_management_related
    confidence: 0.93
    patterns: ["\\b(SOFTWARE|ENGINEERING|TECHNICAL|INFORMATION TECHNOLOGY|IT|DATA|PLATFORM) (MANAGER|DIRECTOR)\\b", "\\bMANAGER OF (SOFTWARE|ENGINEERING|DATA|PLATFORM)", "\\bCHIEF TECHNOLOGY OFFICER\\b", "\\bTECHNICAL PROGRAM MANAGER\\b"]
  - rule_id: software_engineering
    role_family: software_engineering
    confidence: 0.95
    patterns: ["\\bSOFTWARE (ENGINEER|DEVELOPER|ARCHITECT|PROGRAMMER|DEVELOPMENT ENGINEER)", "\\b(APPLICATION|APPLICATIONS) (ENGINEER|DEVELOPER|ARCHITECT)\\b", "\\b(WEB|MOBILE|FULL STACK|FRONT END|BACK END|JAVA|PYTHON|DOT NET) DEVELOPER", "\\bPROGRAMMER ANALYST\\b", "\\bEMBEDDED SOFTWARE", "\\bQA AUTOMATION ENGINEER\\b", "\\bSOFTWARE QUALITY ASSURANCE"]
    exclude_patterns: ["\\bSALES\\b", "\\bRECRUIT", "\\bMEDICAL\\b", "\\b(INTERN|INTERNSHIP|CO OP)\\b"]
  - rule_id: other_computing
    role_family: other_computing
    confidence: 0.91
    patterns: ["\\bINFORMATION TECHNOLOGY (ANALYST|SPECIALIST|CONSULTANT)\\b", "\\bIT ARCHITECT\\b", "\\bCOMPUTER (ANALYST|SPECIALIST|CONSULTANT)\\b", "\\bTECHNICAL ARCHITECT\\b"]

exclusion_rules:
  - rule_id: medical
    confidence: 0.99
    patterns: ["\\b(PHYSICIAN|MEDICAL RESIDENT|RESIDENT PHYSICIAN|SURGEON|NURSE|NURSING|CAREGIVER|MEDICAL TECHNOLOGIST|PHARMACIST|DENTIST|CLINICAL FELLOW)\\b"]
  - rule_id: biological_chemical
    confidence: 0.98
    patterns: ["\\b(BIOLOGICAL|BIOLOGY|CHEMICAL|CHEMISTRY|BIOMEDICAL|MOLECULAR BIOLOGY|BIOCHEM)\\b"]
  - rule_id: sales_recruiting
    confidence: 0.98
    patterns: ["\\bSALES ENGINEER", "\\bRECRUIT(ER|ING|MENT)\\b", "\\bTALENT ACQUISITION", "\\bACCOUNT EXECUTIVE"]
  - rule_id: low_level_it_support
    confidence: 0.97
    patterns: ["\\bHELP ?DESK", "\\bDESKTOP SUPPORT", "\\bIT SUPPORT TECHNICIAN", "\\bCOMPUTER SUPPORT SPECIALIST"]
  - rule_id: nontechnical_management_analysis
    confidence: 0.95
    patterns: ["^(PROJECT MANAGER|PRODUCT MANAGER|BUSINESS ANALYST|MANAGER|DIRECTOR|ASSOCIATE|CONSULTANT)$"]
  - rule_id: postdoctoral
    confidence: 0.99
    patterns: ["\\bPOSTDOC(TORAL)?\\b", "\\bPOST DOCTORAL\\b"]
  - rule_id: faculty
    confidence: 0.99
    patterns: ["\\bPROFESSOR\\b", "\\bLECTURER\\b"]
  - rule_id: student_workers
    confidence: 0.98
    patterns: ["\\bSTUDENT (WORKER|EMPLOYEE|ASSISTANT|AIDE|TRAINEE)\\b", "\\b(GRADUATE|UNDERGRADUATE) STUDENT\\b", "\\b(GRADUATE|UNDERGRADUATE) (RESEARCH |TEACHING )?ASSISTANT\\b"]
  - rule_id: internships
    confidence: 0.95
    patterns: ["\\b(INTERN|INTERNSHIP|CO OP)\\b"]
  - rule_id: clearly_nontechnical
    confidence: 0.99
    patterns: ["\\b(CREW MEMBER|LANDSCAPE LABORER|MEAT CUTTER|FISH CUTTER|POULTRY|TRUCK DRIVER|NURSING ASSISTANT|NURSING AIDE|PRODUCTION WORKER|PACKER)\\b"]

combined_rules:
  - rule_id: computing_research_soc_title
    role_family: computer_science_research
    confidence: 0.91
    soc_prefixes: ["15-", "25-1021"]
    patterns: ["\\b(RESEARCH SCIENTIST|RESEARCHER|RESEARCH FELLOW)\\b"]
  - rule_id: engineering_computing_title
    role_family: research_engineering
    confidence: 0.90
    soc_prefixes: ["17-"]
    patterns: ["\\b(COMPUTATIONAL|SOFTWARE|COMPUTER|SYSTEMS|ELECTRICAL)\\b"]
  - rule_id: statistician_data_title
    role_family: data_science
    confidence: 0.91
    soc_prefixes: ["15-2041", "15-2031"]
    patterns: ["\\b(DATA|COMPUTATIONAL|STATISTICAL|QUANTITATIVE)\\b"]

ambiguous_title_patterns:
  - "^(RESEARCH SCIENTIST|RESEARCH ASSOCIATE|RESEARCH FELLOW)$"
  - "^(ENGINEER|SYSTEMS ENGINEER|ARCHITECT|ANALYST|SCIENTIST)$"
  - "^(TECHNICAL LEAD|TECH LEAD|MANAGER JC50)$"
  - "\\bAPPLIED SCIENTIST\\b"
  - "\\bRESEARCH ENGINEER\\b"
